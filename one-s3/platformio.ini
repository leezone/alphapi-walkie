; AlphaPi One S3 — 对讲机固件（ESP32-S3，ST7789）
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
	lovyan03/LovyanGFX@^1.3.0
build_flags =
	-I src
	-I ../core
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE_CDC=1
	-DARDUINO_ESP32S3_DEV
	-DSPIRAM_MODE_QUAD=1
	-DSPIRAM_SPEED_80M=1
	-DBOARD_HAS_PSRAM
	-DFLASH_SIZE_8MB=1
